name: hospitalcitasfront
description: "A new Flutter project."

# Evita la publicación en pub.dev
publish_to: 'none'  # Remove this line if you wish to publish to pub.dev

# Versión del proyecto
version: 1.0.0+1

environment:
  sdk: ^3.5.4

# Dependencias del proyecto
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  provider: ^6.1.2
  http: ^0.13.6
  cupertino_icons: ^1.0.8
  intl: any
  font_awesome_flutter: ^10.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Configuración de Flutter
flutter:
  uses-material-design: true

  # Sección correcta para los assets
  assets:
    - assets/fondo.jpg
